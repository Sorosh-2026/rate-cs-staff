spring.application.name=rate-cs-staff

# Render supplies PORT automatically. 8080 remains the local fallback.
server.port=${PORT:8080}

# PostgreSQL connection. DATABASE_URL is accepted from Render's database service;
# DB_USERNAME and DB_PASSWORD remain supported for other PostgreSQL providers.
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/rate_staff}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false
