spring.application.name=rate-cs-staff

# Render supplies PORT automatically. 8080 remains the local fallback.
server.port=${PORT:8080}

# PostgreSQL connection.
# Prefer Render's JDBC URL when DATABASE_URL or DATABASE_JDBC_URL is set.
# Fall back to the individual DB_* variables generated by render.yaml.
spring.datasource.url=${DATABASE_JDBC_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:rate_staff}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false
