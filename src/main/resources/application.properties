spring.application.name=rate-cs-staff

# Render supplies PORT automatically. 8080 remains the local fallback.
server.port=${PORT:8080}

# Build a JDBC URL from the PostgreSQL connection components provisioned by
# render.yaml. Do not use Render's DATABASE_URL here: it may be a postgres://
# URI rather than the jdbc:postgresql:// URL expected by the PostgreSQL driver.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:rate_staff}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Declare the dialect explicitly so Hibernate does not need to infer it before
# it can connect and inspect PostgreSQL metadata.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false
