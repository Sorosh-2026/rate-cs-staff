spring.application.name=rate-cs-staff

# Render supplies PORT automatically. 8080 remains the local fallback.
server.port=${PORT:8080}

# PostgreSQL connection. Render supplies DB_HOST, DB_PORT, DB_DATABASE,
# DB_USERNAME, and DB_PASSWORD through render.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:rate_staff}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false
