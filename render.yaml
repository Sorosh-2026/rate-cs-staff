services:
  - type: web
    name: rate-cs-staff
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: rate-cs-staff-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rate-cs-staff-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rate-cs-staff-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rate-cs-staff-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rate-cs-staff-db
          property: password

databases:
  - name: rate-cs-staff-db
    plan: free
